server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        try_files $uri $uri/ =404;
    }

    location ~* \.(?:js|css|woff2?|png|jpg|jpeg|svg|webp|pdf|ico)$ {
        try_files $uri =404;
        expires 1h;
    }
}
